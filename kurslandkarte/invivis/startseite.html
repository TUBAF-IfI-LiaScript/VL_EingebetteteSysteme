<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="%%BESCHREIBUNG%%">
<meta name="author" content="%%AUTOREN%%">
<meta name="generator" content="invivis-kurslandkarte %%VERSION%%">
<title>%%TITEL%%</title>
<style>
:root { --bg: #f3f5f2; --surface: #ffffff; --ink: #1d2a2c; --muted: #5d6c6f; --faint: #c9d1cf; --accent: #1f7a8c; --here: #c2462e; color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #141a1b; --surface: #1c2426; --ink: #e4ebe9; --muted: #9aa9ab; --faint: #3a4648; --accent: #4fb3c6; --here: #ee7a60; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, "Segoe UI", sans-serif; line-height: 1.55; }
main { max-width: 68ch; margin: 0 auto; padding: 40px 16px 48px; display: grid; gap: 14px; }
h1 { margin: 0; font-size: 1.8rem; line-height: 1.2; }
h2 { margin: 20px 0 0; font-size: 1.15rem; }
p { margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
ol, ul { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.karte { display: inline-block; width: fit-content; padding: 10px 16px; border: 1px solid var(--accent); border-radius: 8px; text-decoration: none; font-weight: 600; }
.karte:hover, .karte:focus-visible { background: var(--surface); }
.woche { background: var(--surface); border: 1px solid var(--faint); border-left: 4px solid var(--here); border-radius: 6px; padding: 12px 16px; display: grid; gap: 6px; }
.woche h2 { margin: 0; font-size: 1rem; color: var(--here); }
.woche ul { list-style: none; padding: 0; }
.woche .frage { color: var(--muted); font-size: .92rem; }
.woche .naechst { color: var(--muted); font-size: .92rem; }
dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
dt { color: var(--muted); }
dd { margin: 0; }
@media (max-width: 560px) { dl { grid-template-columns: 1fr; } dd { margin-bottom: 6px; } }
footer { margin-top: 24px; font-size: .85rem; color: var(--muted); display: grid; gap: 4px; }
</style>
</head>
<body>
<main>
  <p class="muted">%%UNTERTITEL%%</p>
  <h1>%%TITEL%%</h1>
  <p>%%INHALT%%</p>

  <section class="woche" id="woche" hidden aria-live="polite"></section>

  <a class="karte" href="%%KARTE%%">🗺️ Kurslandkarte: alle Termine, Begriffe und Zusammenhänge</a>

  %%LERNZIELE%%

  %%ORGANISATION%%

  %%KONTAKT%%

  <footer>
    <span>%%LIZENZ%%</span>
    <span>Quelle: <a href="%%REPO%%">%%REPO%%</a> · Stand %%STAND%%</span>
    <span>Autoren: %%AUTOREN%% · erzeugt mit invivis Kurslandkarte %%VERSION%%</span>
  </footer>
</main>
<script id="termine" type="application/json">%%TERMINE%%</script>
<script>
// „Diese Woche“: alle Termine der laufenden Woche, sonst der nächste Termin
const T = JSON.parse(document.getElementById("termine").textContent);
const heute = new Date();
const iso = (d) => d.toISOString().slice(0, 10);
const montag = new Date(heute); montag.setDate(heute.getDate() - ((heute.getDay() + 6) % 7));
const sonntag = new Date(montag); sonntag.setDate(montag.getDate() + 6);
const datum = (s) => { const [y, m, d] = s.split("-"); return `${+d}.${+m}.`; };
const eintrag = (t) => `<li>${t.url ? `<a href="${t.url}">${t.label} · ${t.kurz}</a>` : `${t.label} · ${t.kurz} <span class="muted">(Material folgt)</span>`}
  <span class="muted">${datum(t.datum)}</span>${t.frage ? `<div class="frage">%%FRAGE%%: ${t.frage}</div>` : ""}</li>`;
const diese = T.filter(t => t.datum >= iso(montag) && t.datum <= iso(sonntag));
const naechster = T.find(t => t.datum > iso(sonntag));
const box = document.getElementById("woche");
if (diese.length) {
  box.innerHTML = `<h2>Diese Woche</h2><ul>${diese.map(eintrag).join("")}</ul>` +
    (naechster ? `<p class="naechst">Danach: ${naechster.label} · ${naechster.kurz} (${datum(naechster.datum)})</p>` : "");
  box.hidden = false;
} else if (naechster) {
  box.innerHTML = `<h2>${T[0].datum > iso(heute) ? "Los geht es mit" : "Als Nächstes"}</h2><ul>${eintrag(naechster)}</ul>`;
  box.hidden = false;
}
</script>
</body>
</html>
